# Lab targets: deliberately vulnerable apps for testing VulnScope. Start them with `make lab`.
#
# They sit on an internal network: no internet access and no ports on the host. Only the worker,
# which will run the scanners (Phase 5), joins that network, so nothing else can reach them.
# Images are pinned by digest so the lab never changes underneath the tests.
services:
  juice-shop:
    image: bkimminich/juice-shop:v20.3.0@sha256:cea5a4af4aacee498c491491af0408934ec81d004035c0a02ef3e54395e3bf27
    networks: [lab]

  dvwa:
    # Unmaintained since 2018, which is fine for an intentionally vulnerable app on a sealed network.
    image: vulnerables/web-dvwa@sha256:dae203fe11646a86937bf04db0079adef295f426da68a92b40e3b181f337daa7
    networks: [lab]

  worker:
    networks: [default, lab]

networks:
  lab:
    internal: true
