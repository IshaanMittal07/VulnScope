[project]
name = "vulnscope"
version = "0.1.0"
description = "Self-hosted security assessment platform"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=1.11",
    "pytest>=8.3",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "N", "SIM"]

[tool.ruff.lint.isort]
# backend/alembic/ (migrations folder) would otherwise make ruff think the library is local.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Tests use assert, and fake tokens that Bandit mistakes for passwords.
"tests/**" = ["S101", "S105", "S106"]
# Autogenerated migrations contain long SQL strings that can't be wrapped.
"alembic/versions/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
